<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ConstructFlow — Summary</title>
<link rel="stylesheet" href="print.css"/>
<link rel="icon" type="image/x-icon" href="logo/favicon.ico"/>
</head>
<body>

<!-- Screen-only toolbar. Hidden by the print stylesheet so it never
     reaches paper. -->
<div class="pr-bar" id="pr-bar">
  <div class="pr-bar-left">
    <img src="logo/logo.png" alt="" width="22" height="22"/>
    <strong>ConstructFlow</strong>
    <span id="pr-bar-what">Preparing…</span>
  </div>
  <div class="pr-bar-right">
    <label class="pr-check" id="pr-photos-wrap" hidden>
      <input type="checkbox" id="pr-photos"/> <span id="pr-photos-label">Include photos</span>
    </label>
    <button class="pr-btn pr-btn-ghost" onclick="closeDocument()">Close</button>
    <button class="pr-btn" id="pr-print" onclick="window.print()">Print / Save as PDF</button>
  </div>
</div>

<div class="pr-state" id="pr-state">Loading…</div>

<!-- .sheet is the paper; .page is the ink. fitToPage() scales .page so the
     content fills the sheet, which keeps the paper a constant A4 on screen
     while the content grows or shrinks inside it. -->
<main class="sheet" id="sheet" hidden><div class="page" id="page"></div></main>
<!-- Page two: the photos, when they are included. Same zoom as page one. -->
<main class="sheet" id="sheet2" hidden><div class="page" id="page2"></div></main>

<script src="print.js"></script>
</body>
</html>
