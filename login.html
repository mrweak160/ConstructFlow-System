<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#f59e0b"/>
<link rel="manifest" href="manifest.json"/>
<title>ConstructFlow — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body data-page="login">
<div class="toast-container" id="toasts"></div>

<div id="login" class="screen active">
  <div class="login-box">
    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="var(--amber)"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5L12 1z"/></svg>
    </div>
    <div class="login-title">ConstructFlow</div>
    <div class="login-sub">Work Order Coordination System</div>
    <div class="login-form">
      <div class="login-group">
        <label>User Email</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="email" id="l-email" placeholder="email@constructflow.com"/>
        </div>
      </div>
      <div class="login-group">
        <label>Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="l-pass" placeholder="••••••••"/>
        </div>
      </div>
      <div class="login-group">
        <label>System Access Role</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <select id="l-role">
            <option value="inspector">Field Inspector</option>
            <option value="supervisor">Supervisor</option>
            <option value="fieldworker">Field Worker</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
      </div>
      <div class="login-err" id="l-err">Invalid credentials. Please try again.</div>
      <button class="btn-login" onclick="doLogin()">Sign In</button>
    </div>
    <div class="login-footer">ConstructFlow v1.0 • Capstone Project</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
